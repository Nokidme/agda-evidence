name: native candidates pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out agda-evidence
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native Agda and agda-evidence
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends agda-bin
          /usr/bin/agda --version
          python -m pip install -e .

      - name: Try explicit candidates without filling source goals
        run: |
          python scripts/candidates-pilot.py --agda-bin /usr/bin/agda \
            --output "$RUNNER_TEMP/native-candidates-pilot"
          agda-evidence goals verify "$RUNNER_TEMP/native-candidates-pilot/listing.json"
          for observation in "$RUNNER_TEMP/native-candidates-pilot"/*.candidate.json; do
            agda-evidence goals verify-check "$observation"
          done

      - name: Require an unchanged source checkout
        run: |
          git status --short
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Upload independent elaboration and rejection records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-candidates-pilot-${{ github.sha }}
          path: ${{ runner.temp }}/native-candidates-pilot
          if-no-files-found: warn
          retention-days: 30
