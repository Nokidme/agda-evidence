name: agda-algebras pilot

on:
  workflow_dispatch:
    inputs:
      algebra_ref:
        description: Pinned ualib/agda-algebras commit to validate
        required: true
        default: c7617677f0e4233939660aa42e7fafb2f68e95e0
        type: string

permissions:
  contents: read

jobs:
  capture:
    name: Capture upstream Type-check library lane
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ALGEBRA_REF: ${{ inputs.algebra_ref }}
    steps:
      - name: Check out agda-evidence
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agda-evidence
        run: python -m pip install .

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Configure the public formalverification binary cache
        uses: cachix/cachix-action@v16
        with:
          name: formalverification

      - name: Check out the pinned agda-algebras source
        run: |
          git clone https://github.com/ualib/agda-algebras.git agda-algebras
          git -C agda-algebras checkout --detach "$ALGEBRA_REF"
          test -z "$(git -C agda-algebras status --porcelain)"
          test ! -e agda-algebras/.agda
          test ! -e agda-algebras/_build

      - name: Probe the flake-provided Agda resolution
        working-directory: agda-algebras
        run: |
          nix develop --command agda-evidence probe-nix-resolution \
            --project-root "$PWD" \
            --output "$RUNNER_TEMP/agda-algebras-resolution.json"
          rm -rf .agda
          test ! -e .agda

      - name: Capture the upstream Type-check library lane
        run: |
          agda-evidence capture \
            --project-root "$GITHUB_WORKSPACE/agda-algebras" \
            --output "$GITHUB_WORKSPACE/agda-algebras.evidence" \
            --resolution-file "$RUNNER_TEMP/agda-algebras-resolution.json" \
            --scope "agda-algebras Type-check library CI lane at $ALGEBRA_REF" \
            --timeout-seconds 3600 \
            -- bash -euo pipefail -c '
              nix flake check --no-write-lock-file
              nix develop --no-write-lock-file --command make check
            '
          agda-evidence verify "$GITHUB_WORKSPACE/agda-algebras.evidence"

      - name: Require a green recorded gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          attestation = json.loads(Path("agda-algebras.evidence/attestation.json").read_text())
          outcome = attestation["outcome"]
          if outcome["status"] != "passed":
              raise SystemExit(f"Recorded agda-algebras gate did not pass: {outcome}")
          print(f"Recorded agda-algebras gate passed: {attestation['attestationId']}")
          PY

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agda-algebras-evidence-${{ inputs.algebra_ref }}
          path: agda-algebras.evidence
          if-no-files-found: warn
          retention-days: 30
